<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聯絡我們 - 企業官網</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { line-height: 1.6; color: #333; background-color: #f9f9f9; }
        header { background-color: #2c3e50; color: #fff; padding: 1rem 0; }
        nav { display: flex; justify-content: space-between; align-items: center; max-width: 1000px; margin: 0 auto; padding: 0 20px; }
        nav ul { display: flex; list-style: none; }
        nav ul li { margin-left: 20px; }
        nav ul li a { color: #fff; text-decoration: none; font-weight: bold; }
        nav ul li a.active { color: #3498db; text-decoration: underline; }
        main { max-width: 1000px; margin: 40px auto; padding: 40px 20px; background: #fff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); min-height: 400px; }
        h1 { margin-bottom: 20px; color: #2c3e50; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button[type="submit"] { background-color: #3498db; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button[type="submit"]:hover { background-color: #2980b9; }
        footer { text-align: center; padding: 20px; background-color: #2c3e50; color: #fff; margin-top: 40px; }
    </style>
</head>
<body>

    <header>
        <nav>
            <h2>企業名稱</h2>
            <ul>
                <li><a href="index.html">首頁</a></li>
                <li><a href="about.html">公司介紹</a></li>
                <li><a href="contact.html" class="active">聯絡我們</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>聯絡我們</h1>
        <!-- ⚠️ 請將下面的 Formspree 網址替換為你的 Formspree 表單連結 ⚠️ -->
        <form action="https://formspree.io/f/你的Formspree_ID" method="POST">
            <div class="form-group">
                <label for="name">姓名：</label>
                <input type="text" id="name" name="姓名" required placeholder="請輸入姓名">
            </div>
            <div class="form-group">
                <label for="phone">電話：</label>
                <input type="tel" id="phone" name="電話" required placeholder="請輸入電話">
            </div>
            <div class="form-group">
                <label for="email">EMAIL：</label>
                <input type="email" id="email" name="EMAIL" required placeholder="請輸入電子信箱">
            </div>
            <div class="form-group">
                <label for="message">聯絡內容：</label>
                <textarea id="message" name="聯絡內容" rows="5" required placeholder="請輸入聯絡內容..."></textarea>
            </div>
            <button type="submit">送出</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 企業名稱. All Rights Reserved.</p>
    </footer>

</body>
</html>
