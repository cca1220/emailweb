<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公司官方網站</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            line-height: 1.6;
            color: #333;
            background-color: #f9f9f9;
        }
        header {
            background-color: #2c3e50;
            color: #fff;
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
        }
        nav ul {
            display: flex;
            list-style: none;
        }
        nav ul li {
            margin-left: 20px;
        }
        nav ul li a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
        }
        section {
            max-width: 1000px;
            margin: 40px auto;
            padding: 40px 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h2 {
            margin-bottom: 20px;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button[type="submit"] {
            background-color: #3498db;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button[type="submit"]:hover {
            background-color: #2980b9;
        }
        footer {
            text-align: center;
            padding: 20px;
            background-color: #2c3e50;
            color: #fff;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <h1>企業名稱</h1>
            <ul>
                <li><a href="#home">首頁</a></li>
                <li><a href="#about">公司介紹</a></li>
                <li><a href="#contact">聯絡我們</a></li>
            </ul>
        </nav>
    </header>

    <!-- 首頁區塊 -->
    <section id="home">
        <h2>歡迎來到我們的網站</h2>
        <p>我們致力於提供最優質的服務與創新方案，協助客戶實現目標與願景。</p>
    </section>

    <!-- 公司介紹區塊 -->
    <section id="about">
        <h2>公司介紹</h2>
        <p>本公司成立於 2026 年，專注於提供專業的資訊與網頁解決方案。我們的團隊擁有豐富的經驗，始終秉持專業、誠信與創新的精神服務廣大客戶。</p>
    </section>

    <!-- 聯絡我們區塊 -->
    <section id="contact">
        <h2>聯絡我們</h2>
        <!-- ⚠️ 請將下方的 FORM_ID 替換成你在 Formspree 取得的專屬 ID ⚠️ -->
        <action="https://formspree.io/f/你的Formspree_ID" method="POST">
            <div class="form-group">
                <label for="name">姓名：</label>
                <input type="text" id="name" name="name" required placeholder="請輸入您的姓名">
            </div>
            <div class="form-group">
                <label for="phone">電話：</label>
                <input type="tel" id="phone" name="phone" required placeholder="請輸入您的聯絡電話">
            </div>
            <div class="form-group">
                <label for="email">EMAIL：</label>
                <input type="email" id="email" name="_replyto" required placeholder="請輸入您的電子信箱">
            </div>
            <div class="form-group">
                <label for="message">聯絡內容：</label>
                <textarea id="message" name="message" rows="5" required placeholder="請輸入想與我們聯絡的內容..."></textarea>
            </div>
            <button type="submit">送出表單</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2026 企業名稱. All Rights Reserved.</p>
    </footer>

</body>
</html>
